[package]
name = "diffpack-next"
version = "0.1.0"
edition = "2024"
description = "Next.js adapters for diffpack"
license = "MIT"

[dependencies]
diffpack-core = { path = "../diffpack-core" }
diffpack-default-loader = { path = "../diffpack-default-loader" }
diffpack-vite-compat = { path = "../diffpack-vite-compat" }
diffpack-web = { path = "../diffpack-web" }
markdown = "1.0"
notify = "8.2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
oxc_allocator = "0.140.0"
oxc_ast = "0.140.0"
oxc_ast_visit = "0.140.0"
oxc_codegen = "0.140.0"
oxc_parser = "0.140.0"
oxc_resolver = "11.24.2"
oxc_semantic = "0.140.0"
oxc_span = "0.140.0"
oxc_transformer = "0.140.0"
rayon = "1.10"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.23.0"
