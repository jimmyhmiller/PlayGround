[package]
name = "diffpack"
version = "0.1.0"
edition = "2024"
description = "An experimental incremental JavaScript bundler built with Oxc"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/diffpack-core",
    "crates/diffpack-default-loader",
    "crates/diffpack-web",
    "crates/diffpack-vite-compat",
    "crates/diffpack-next",
    "crates/diffpack-tanstack",
    "examples/external-provider",
    "integrations/next-bindings/crate",
]
resolver = "3"

[features]
# Compiles in the deterministic allocation-accounting layer (a tracking global
# allocator) used ONLY by `bundle-scale-memory` and the memory thesis guards.
# Production/default builds have NO allocator override: plain system malloc.
memory-accounting = ["diffpack-web/memory-accounting"]

[dependencies]
diffpack-core = { path = "crates/diffpack-core" }
diffpack-default-loader = { path = "crates/diffpack-default-loader", features = ["legacy-driver-tests"] }
diffpack-vite-compat = { path = "crates/diffpack-vite-compat" }
diffpack-web = { path = "crates/diffpack-web" }
diffpack-next = { path = "crates/diffpack-next" }
diffpack-tanstack = { path = "crates/diffpack-tanstack" }
serde_json = "1.0.150"
notify = "8.2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
oxc_sourcemap = "8.1.1"
oxc_resolver = "11.24.2"
rayon = "1.11.0"
tempfile = "3.23.0"
