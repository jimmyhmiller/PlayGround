[package]
name = "nodeaddon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Test fixture: a real Node native addon (N-API cdylib) instrumented with memscope."

[lib]
# What node loads. The `.node` file it actually opens is a copy of this cdylib.
crate-type = ["cdylib"]

[dependencies]
memscope = { path = "../memscope" }
