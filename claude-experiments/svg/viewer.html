<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a1a; width: 100vw; height: 100vh; }
  #controls { position: fixed; top: 10px; right: 10px; z-index: 30; display: flex; gap: 8px; flex-wrap: wrap; max-width: 500px; justify-content: flex-end; }
  button {
    padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 14px; background: #333; color: #fff;
  }
  button.active { background: #4a9eff; }
  #viewport {
    width: 100vw; height: 100vh; position: relative;
    overflow: hidden; cursor: grab;
  }
  #viewport:active { cursor: grabbing; }
  #canvas {
    position: absolute; transform-origin: 0 0;
  }
  #canvas svg { display: block; }

  .bg-none #canvas { background: transparent; }
  .bg-checker #canvas {
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%),
      linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  .bg-white #canvas { background: #ffffff; }
  .bg-black #canvas { background: #000000; }
  .bg-navy #canvas { background: #001f3f; }

  /* Color panel */
  #color-panel {
    position: fixed; top: 0; left: 0; width: 340px; height: 100vh;
    background: #222; z-index: 20; overflow-y: auto; padding: 12px;
    transform: translateX(-100%); transition: transform 0.2s;
  }
  #color-panel.open { transform: translateX(0); }
  #color-panel h3 { color: #fff; margin-bottom: 8px; font-size: 14px; }
  #color-panel .panel-controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  #color-panel .panel-controls button { font-size: 12px; padding: 4px 10px; }
  .color-item {
    display: flex; align-items: center; gap: 6px; padding: 5px 4px;
    border-bottom: 1px solid #333;
  }
  .color-swatch {
    width: 24px; height: 24px; border-radius: 3px; border: 2px solid #555;
    flex-shrink: 0;
  }
  .color-label { color: #ccc; font-size: 13px; font-family: monospace; }
  .color-count { color: #777; font-size: 11px; margin-left: auto; flex-shrink: 0; }
  .color-toggle {
    background: #444; color: #fff; border: none; border-radius: 3px;
    padding: 2px 6px; cursor: pointer; font-size: 11px; flex-shrink: 0;
  }
  .color-toggle.hidden-color { background: #900; }
  .color-remap-input {
    width: 70px; background: #333; color: #fff; border: 1px solid #555;
    border-radius: 3px; padding: 2px 4px; font-size: 12px; font-family: monospace;
  }
  .color-remap-input.remapped { border-color: #0f0; }
  .color-opacity-input {
    width: 42px; background: #333; color: #fff; border: 1px solid #555;
    border-radius: 3px; padding: 2px 4px; font-size: 12px; font-family: monospace;
  }
  .color-opacity-input.remapped { border-color: #0f0; }
  .remap-swatch {
    width: 24px; height: 24px; border-radius: 3px; border: 2px solid #0f0;
    flex-shrink: 0; display: none;
  }
  .remap-swatch.visible { display: block; }

  #drop-prompt {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #666; font-size: 24px; font-family: sans-serif;
    pointer-events: none; user-select: none;
  }

  /* Path selection - highlight is done via SVG clone overlay */
  #path-editor {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #222; border: 1px solid #555; border-radius: 6px;
    padding: 12px 16px; z-index: 40; display: none;
    color: #ccc; font-size: 13px; font-family: monospace;
    min-width: 300px;
  }
  #path-editor.open { display: flex; flex-direction: column; gap: 8px; }
  #path-editor .pe-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  #path-editor .pe-header span { font-size: 12px; color: #999; }
  #path-editor .pe-close {
    background: #444; color: #fff; border: none; border-radius: 3px;
    padding: 2px 8px; cursor: pointer; font-size: 12px;
  }
  #path-editor .pe-row {
    display: flex; align-items: center; gap: 8px;
  }
  #path-editor .pe-label { width: 50px; color: #999; font-size: 12px; }
  #path-editor .pe-swatch {
    width: 20px; height: 20px; border-radius: 3px; border: 1px solid #555;
    flex-shrink: 0;
  }
  #path-editor .pe-input {
    width: 80px; background: #333; color: #fff; border: 1px solid #555;
    border-radius: 3px; padding: 2px 4px; font-size: 12px; font-family: monospace;
  }
  #path-editor .pe-opacity-input {
    width: 50px; background: #333; color: #fff; border: 1px solid #555;
    border-radius: 3px; padding: 2px 4px; font-size: 12px; font-family: monospace;
  }
  #path-editor .pe-header-btns { display: flex; gap: 6px; }
  #path-editor .pe-delete {
    background: #900; color: #fff; border: none; border-radius: 3px;
    padding: 2px 8px; cursor: pointer; font-size: 12px;
  }
  #path-editor .pe-delete:hover { background: #b00; }
  #path-editor .pe-note { color: #999; font-size: 12px; }
  #path-editor .pe-sep { height: 1px; background: #444; margin: 2px 0; }
  #path-editor .pe-slider { flex: 1; min-width: 130px; accent-color: #4a9eff; }
  #path-editor .pe-inherited { color: #4a9eff; }
</style>
</head>
<body>
  <div id="controls">
    <button onclick="toggleColorPanel()" id="btn-colors">Colors</button>
    <button onclick="setBg('none')" id="btn-none">None</button>
    <button onclick="setBg('checker')" id="btn-checker" class="active">Checker</button>
    <button onclick="setBg('white')" id="btn-white">White</button>
    <button onclick="setBg('black')" id="btn-black">Black</button>
    <button onclick="setBg('navy')" id="btn-navy">Navy</button>
    <button onclick="resetView()">Reset View</button>
    <button onclick="saveSvg()" id="btn-save">Save</button>
    <button onclick="saveSvgAs()">Save As</button>
    <button onclick="undoPathEdit()" id="btn-undo">Undo</button>
    <button onclick="redoPathEdit()" id="btn-redo">Redo</button>
    <button onclick="resetAll()" style="background:#900">Reset All</button>
  </div>

  <div id="color-panel">
    <h3>Colors</h3>
    <div class="panel-controls">
      <button onclick="showAllColors()">Show All</button>
      <button onclick="hideAllColors()">Hide All</button>
      <button onclick="resetRemaps()">Reset Remaps</button>
      <button onclick="exportSvg()">Export SVG</button>
    </div>
    <div id="color-list"></div>
  </div>

  <div id="path-editor">
    <div class="pe-header">
      <span id="pe-tag"></span>
      <div class="pe-header-btns">
        <button class="pe-delete" onclick="deleteSelected()">Delete</button>
        <button class="pe-close" onclick="deselectPath()">X</button>
      </div>
    </div>
    <div id="pe-rows"></div>
  </div>

  <div id="viewport" class="bg-checker">
    <div id="canvas"></div>
    <div id="drop-prompt">Drop an SVG file here</div>
  </div>

  <script>
    var viewport = document.getElementById('viewport');
    var canvas = document.getElementById('canvas');
    var colorPanel = document.getElementById('color-panel');
    var colorList = document.getElementById('color-list');

    var scale = 1, tx = 0, ty = 0;
    var isDragging = false;
    var dragStartX, dragStartY, dragTxStart, dragTyStart;
    var svgEl = null;

    var STORAGE_KEY = 'svg-viewer-state';
    var colorMap = {};
    var hiddenColors = {};
    var remapColors = {};
    var remapOpacities = {}; // originalColor -> opacity string (0-1)
    var pathEdits = {}; // elKey -> { fill, stroke, 'fill-opacity', 'stroke-opacity' }
    var elKeyMap = {}; // elKey -> element (built after SVG loads)
    var elToKey = null; // WeakMap: element -> elKey
    var undoStack = []; // snapshots of the document before each edit
    var redoStack = [];

    // Keys are stamped onto the elements so they survive a history restore,
    // where document order can differ from the original file. They are
    // stripped again on save/export.
    function buildElKeys(svg) {
      elKeyMap = {};
      elToKey = new WeakMap();
      var allEls = svg.querySelectorAll('*');
      for (var i = 0; i < allEls.length; i++) {
        var el = allEls[i];
        var key = el.getAttribute('data-svgv-key') || (el.id ? 'id:' + el.id : 'idx:' + i);
        el.setAttribute('data-svgv-key', key);
        elKeyMap[key] = el;
        elToKey.set(el, key);
      }
    }

    function getElKey(el) {
      return elToKey ? elToKey.get(el) : null;
    }

    function saveState() {
      var bgClass = viewport.className || 'bg-checker';
      var state = {
        remapColors: remapColors,
        remapOpacities: remapOpacities,
        hiddenColors: hiddenColors,
        bgMode: bgClass,
        pathEdits: pathEdits
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch(e) {}
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch(e) {
        return null;
      }
    }

    function applyPathEdits() {
      var keys = Object.keys(pathEdits);
      for (var i = 0; i < keys.length; i++) {
        var el = elKeyMap[keys[i]];
        if (!el) continue;
        var edits = pathEdits[keys[i]];
        if (edits.d) {
          el.setAttribute('d', edits.d);
        }
        if (edits.fill) {
          var style = el.getAttribute('style') || '';
          if (/fill\s*:/.test(style)) {
            el.setAttribute('style', style.replace(/(fill\s*:\s*)([^;]+)/, '$1' + edits.fill));
          } else if (el.hasAttribute('fill')) {
            el.setAttribute('fill', edits.fill);
          } else {
            setStyleProp(el, 'fill', edits.fill); // inherited fill
          }
        }
        if (edits.stroke) {
          var style = el.getAttribute('style') || '';
          if (/stroke\s*:/.test(style)) {
            el.setAttribute('style', style.replace(/(stroke\s*:\s*)([^;]+)/, '$1' + edits.stroke));
          } else if (el.hasAttribute('stroke')) {
            el.setAttribute('stroke', edits.stroke);
          } else {
            setStyleProp(el, 'stroke', edits.stroke); // inherited stroke
          }
        }
        if (edits['fill-opacity'] !== undefined) {
          setOpacity(el, 'fill', edits['fill-opacity']);
        }
        if (edits['stroke-opacity'] !== undefined) {
          setOpacity(el, 'stroke', edits['stroke-opacity']);
        }
        if (edits.outset) {
          applyOutset(el, parseFloat(edits.outset));
        }
        if (edits.deleted && el.parentNode) {
          el.parentNode.removeChild(el);
        }
      }
    }

    function recordPathEdit(el, type, value) {
      var key = getElKey(el);
      if (!key) return;
      if (!pathEdits[key]) pathEdits[key] = {};
      pathEdits[key][type] = value;
      saveState();
    }

    function applyTransform() {
      canvas.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
      refreshHandleScale(); // keep point handles the same size on screen
    }

    function resetView() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var svgW = svgEl ? parseFloat(svgEl.getAttribute('width')) || 1605 : 1605;
      var svgH = svgEl ? parseFloat(svgEl.getAttribute('height')) || 1958 : 1958;
      scale = Math.min(vw / svgW, vh / svgH) * 0.9;
      tx = (vw - svgW * scale) / 2;
      ty = (vh - svgH * scale) / 2;
      applyTransform();
    }

    function setBg(mode) {
      viewport.className = 'bg-' + mode;
      var btns = document.querySelectorAll('#controls button');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      var btn = document.getElementById('btn-' + mode);
      if (btn) btn.classList.add('active');
      saveState();
    }

    function toggleColorPanel() {
      colorPanel.classList.toggle('open');
      document.getElementById('btn-colors').classList.toggle('active');
    }

    function normalizeColor(c) {
      if (!c || c === 'none' || c === 'transparent') return null;
      c = c.trim().toLowerCase();
      if (/^#[0-9a-f]{3}$/.test(c)) {
        c = '#' + c[1]+c[1] + c[2]+c[2] + c[3]+c[3];
      }
      var rgbMatch = c.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/);
      if (rgbMatch) {
        c = '#' + parseInt(rgbMatch[1]).toString(16).padStart(2,'0')
              + parseInt(rgbMatch[2]).toString(16).padStart(2,'0')
              + parseInt(rgbMatch[3]).toString(16).padStart(2,'0');
      }
      return c;
    }

    function setStyleProp(el, prop, value) {
      var style = el.getAttribute('style') || '';
      var re = new RegExp('(^|;)(\\s*' + prop + '\\s*:\\s*)([^;]*)');
      if (re.test(style)) {
        style = style.replace(re, '$1$2' + value);
      } else {
        style = style ? style.replace(/;\s*$/, '') + ';' + prop + ':' + value : prop + ':' + value;
      }
      el.setAttribute('style', style);
    }

    function removeStyleProp(el, prop) {
      var style = el.getAttribute('style');
      if (!style) return;
      style = style.replace(new RegExp('(^|;)\\s*' + prop + '\\s*:\\s*[^;]*', 'g'), '$1')
        .replace(/;{2,}/g, ';').replace(/^;+/, '').replace(/;\s*$/, '');
      if (style) el.setAttribute('style', style); else el.removeAttribute('style');
    }

    // The paint an element actually renders with, including values inherited
    // from an ancestor <g> or coming from a CSS rule in the file.
    function computedPaint(el, type) {
      var cs;
      try { cs = window.getComputedStyle(el); } catch (e) { return null; }
      if (!cs) return null;
      var c = normalizeColor(cs.getPropertyValue(type));
      if (!c) return null;
      var rgba = c.match(/^rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*([\d.]+)\s*\)$/);
      if (rgba) {
        if (parseFloat(rgba[4]) === 0) return null;
        c = '#' + parseInt(rgba[1],10).toString(16).padStart(2,'0')
              + parseInt(rgba[2],10).toString(16).padStart(2,'0')
              + parseInt(rgba[3],10).toString(16).padStart(2,'0');
      }
      return /^#[0-9a-f]{6}$/.test(c) ? c : null;
    }

    function getOriginalOpacity(el, type) {
      // type is 'fill' or 'stroke' -> look for fill-opacity or stroke-opacity
      var opacityProp = type + '-opacity';
      var style = el.getAttribute('style') || '';
      var match = style.match(new RegExp('(?:^|;)\\s*' + opacityProp + '\\s*:\\s*([^;]+)'));
      if (match) return match[1].trim();
      var attr = el.getAttribute(opacityProp);
      if (attr) return attr;
      return null; // means default (1.0)
    }

    function extractColors(el, includeInherited) {
      var results = [];
      var fill = el.getAttribute('fill');
      var nf = normalizeColor(fill);
      if (nf) results.push({ color: nf, type: 'fill', prop: 'attr', origOpacity: getOriginalOpacity(el, 'fill') });

      var stroke = el.getAttribute('stroke');
      var ns = normalizeColor(stroke);
      if (ns) results.push({ color: ns, type: 'stroke', prop: 'attr', origOpacity: getOriginalOpacity(el, 'stroke') });

      var style = el.getAttribute('style');
      if (style) {
        var fillMatch = style.match(/(?:^|;)\s*fill\s*:\s*([^;]+)/);
        if (fillMatch) {
          var nfc = normalizeColor(fillMatch[1]);
          if (nfc) results.push({ color: nfc, type: 'fill', prop: 'style', origOpacity: getOriginalOpacity(el, 'fill') });
        }
        var strokeMatch = style.match(/(?:^|;)\s*stroke\s*:\s*([^;]+)/);
        if (strokeMatch) {
          var nsc = normalizeColor(strokeMatch[1]);
          if (nsc) results.push({ color: nsc, type: 'stroke', prop: 'style', origOpacity: getOriginalOpacity(el, 'stroke') });
        }
      }

      if (includeInherited) {
        var haveFill = false, haveStroke = false;
        for (var i = 0; i < results.length; i++) {
          if (results[i].type === 'fill') haveFill = true;
          if (results[i].type === 'stroke') haveStroke = true;
        }
        // Inherited paint has to be overridden with an inline style: a
        // presentation attribute loses to any CSS rule in the document.
        if (!haveFill) {
          var cf = computedPaint(el, 'fill');
          if (cf) results.push({ color: cf, type: 'fill', prop: 'style', inherited: true, origOpacity: getOriginalOpacity(el, 'fill') });
        }
        if (!haveStroke) {
          var cs = computedPaint(el, 'stroke');
          if (cs) results.push({ color: cs, type: 'stroke', prop: 'style', inherited: true, origOpacity: getOriginalOpacity(el, 'stroke') });
        }
      }
      return results;
    }

    function buildColorMap(svg) {
      colorMap = {};
      var allEls = svg.querySelectorAll('*');
      for (var i = 0; i < allEls.length; i++) {
        var el = allEls[i];
        var colors = extractColors(el);
        for (var j = 0; j < colors.length; j++) {
          var entry = colors[j];
          if (!colorMap[entry.color]) colorMap[entry.color] = [];
          colorMap[entry.color].push({ el: el, type: entry.type, prop: entry.prop, origOpacity: entry.origOpacity });
        }
      }
    }

    function applyRemap(origColor, newColor) {
      var entries = colorMap[origColor] || [];
      for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        if (e.prop === 'attr') {
          e.el.setAttribute(e.type, newColor);
        } else {
          var style = e.el.getAttribute('style') || '';
          var regex = new RegExp('(' + e.type + '\\s*:\\s*)([^;]+)');
          e.el.setAttribute('style', style.replace(regex, '$1' + newColor));
        }
      }
    }

    function setOpacity(el, type, val) {
      var opacityProp = type + '-opacity';
      var style = el.getAttribute('style') || '';
      var regex = new RegExp('(' + opacityProp + '\\s*:\\s*)([^;]+)');
      if (regex.test(style)) {
        el.setAttribute('style', style.replace(regex, '$1' + val));
      } else if (style) {
        el.setAttribute('style', style + ';' + opacityProp + ':' + val);
      } else {
        el.setAttribute(opacityProp, val);
      }
    }

    // Outset: stroke a shape in its own fill color so it grows outward by half
    // the stroke width, closing thin gaps against neighbouring shapes.
    var STROKE_PROPS = ['stroke', 'stroke-width', 'stroke-linejoin', 'stroke-linecap', 'stroke-opacity'];
    var outsetOrig = new WeakMap();

    function snapshotStroke(el) {
      var snap = { attrs: {}, styles: {} };
      var style = el.getAttribute('style') || '';
      for (var i = 0; i < STROKE_PROPS.length; i++) {
        var p = STROKE_PROPS[i];
        snap.attrs[p] = el.hasAttribute(p) ? el.getAttribute(p) : null;
        var m = style.match(new RegExp('(^|;)\\s*' + p + '\\s*:\\s*([^;]*)'));
        snap.styles[p] = m ? m[2].trim() : null;
      }
      return snap;
    }

    function restoreStroke(el, snap) {
      for (var i = 0; i < STROKE_PROPS.length; i++) {
        var p = STROKE_PROPS[i];
        if (snap.attrs[p] === null) el.removeAttribute(p);
        else el.setAttribute(p, snap.attrs[p]);
        if (snap.styles[p] === null) removeStyleProp(el, p);
        else setStyleProp(el, p, snap.styles[p]);
      }
    }

    function currentFillColor(el) {
      var colors = extractColors(el, true);
      for (var i = 0; i < colors.length; i++) {
        if (colors[i].type === 'fill') return colors[i].color;
      }
      return null;
    }

    function applyOutset(el, width) {
      if (!outsetOrig.has(el)) outsetOrig.set(el, snapshotStroke(el));
      restoreStroke(el, outsetOrig.get(el));
      if (!(width > 0)) return;
      setStyleProp(el, 'stroke', currentFillColor(el) || '#000000');
      setStyleProp(el, 'stroke-width', width * 2);
      setStyleProp(el, 'stroke-linejoin', 'round');
      setStyleProp(el, 'stroke-linecap', 'round');
      var fillOp = getOriginalOpacity(el, 'fill');
      if (fillOp) setStyleProp(el, 'stroke-opacity', fillOp);
    }

    function getOutset(el) {
      var key = getElKey(el);
      if (!key || !pathEdits[key]) return 0;
      return parseFloat(pathEdits[key].outset) || 0;
    }

    function setOutset(el, width) {
      applyOutset(el, width);
      var key = getElKey(el);
      if (key) {
        if (width > 0) {
          if (!pathEdits[key]) pathEdits[key] = {};
          pathEdits[key].outset = width;
        } else if (pathEdits[key]) {
          delete pathEdits[key].outset;
          if (!Object.keys(pathEdits[key]).length) delete pathEdits[key];
        }
      }
      saveState();
    }

    function maxOutset() {
      var w = svgEl ? parseFloat(svgEl.getAttribute('width')) || 0 : 0;
      var h = svgEl ? parseFloat(svgEl.getAttribute('height')) || 0 : 0;
      return Math.max(20, Math.round(Math.max(w, h) / 40));
    }

    function resetOpacity(el, type, origOpacity) {
      var opacityProp = type + '-opacity';
      if (origOpacity === null) {
        // Remove it
        el.removeAttribute(opacityProp);
        removeStyleProp(el, opacityProp);
      } else {
        setOpacity(el, type, origOpacity);
      }
    }

    function applyAllRemaps() {
      // Reset all to original first
      var origColors = Object.keys(colorMap);
      for (var i = 0; i < origColors.length; i++) {
        var origColor = origColors[i];
        var entries = colorMap[origColor];
        for (var j = 0; j < entries.length; j++) {
          var e = entries[j];
          if (e.prop === 'attr') {
            e.el.setAttribute(e.type, origColor);
          } else {
            var style = e.el.getAttribute('style') || '';
            var regex = new RegExp('(' + e.type + '\\s*:\\s*)([^;]+)');
            e.el.setAttribute('style', style.replace(regex, '$1' + origColor));
          }
          resetOpacity(e.el, e.type, e.origOpacity);
        }
      }
      // Then apply color remaps
      var remapKeys = Object.keys(remapColors);
      for (var i = 0; i < remapKeys.length; i++) {
        applyRemap(remapKeys[i], remapColors[remapKeys[i]]);
      }
      // Then apply opacity remaps
      var opacityKeys = Object.keys(remapOpacities);
      for (var i = 0; i < opacityKeys.length; i++) {
        var origColor = opacityKeys[i];
        var opacity = remapOpacities[origColor];
        var entries = colorMap[origColor] || [];
        for (var j = 0; j < entries.length; j++) {
          setOpacity(entries[j].el, entries[j].type, opacity);
        }
      }
    }

    function handleRemapInput(origColor, inputEl, swatchEl) {
      var val = inputEl.value.trim().toLowerCase();
      var before = snapshot();
      if (!val) {
        delete remapColors[origColor];
        inputEl.classList.remove('remapped');
        swatchEl.classList.remove('visible');
      } else {
        if (val[0] !== '#') val = '#' + val;
        if (/^#[0-9a-f]{6}$/.test(val) || /^#[0-9a-f]{3}$/.test(val)) {
          remapColors[origColor] = val;
          inputEl.classList.add('remapped');
          swatchEl.style.background = val;
          swatchEl.classList.add('visible');
        } else {
          return; // invalid, do nothing
        }
      }
      pushSnapshot(before);
      applyAllRemaps();
      saveState();
    }

    function renderColorList() {
      colorList.innerHTML = '';
      var sorted = Object.keys(colorMap).sort(function(a, b) {
        return colorMap[b].length - colorMap[a].length;
      });
      for (var i = 0; i < sorted.length; i++) {
        var color = sorted[i];
        var entries = colorMap[color];
        var isHidden = !!hiddenColors[color];
        var remapped = remapColors[color] || '';

        var item = document.createElement('div');
        item.className = 'color-item';

        // Toggle button
        var toggle = document.createElement('button');
        toggle.className = 'color-toggle' + (isHidden ? ' hidden-color' : '');
        toggle.textContent = isHidden ? 'OFF' : 'ON';
        toggle.setAttribute('data-color', color);
        toggle.addEventListener('click', (function(c) {
          return function(e) {
            e.stopPropagation();
            toggleColor(c);
          };
        })(color));

        // Original swatch
        var swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.background = color;

        // Figure out the original opacity (most common among entries)
        var opacityCounts = {};
        for (var j = 0; j < entries.length; j++) {
          var op = entries[j].origOpacity || '1';
          opacityCounts[op] = (opacityCounts[op] || 0) + 1;
        }
        var origOpacity = '1';
        var maxCount = 0;
        var opKeys = Object.keys(opacityCounts);
        for (var j = 0; j < opKeys.length; j++) {
          if (opacityCounts[opKeys[j]] > maxCount) {
            maxCount = opacityCounts[opKeys[j]];
            origOpacity = opKeys[j];
          }
        }

        // Label
        var label = document.createElement('span');
        label.className = 'color-label';
        label.textContent = color + ' @ ' + origOpacity;

        // Remap input
        var input = document.createElement('input');
        input.className = 'color-remap-input' + (remapped ? ' remapped' : '');
        input.type = 'text';
        input.placeholder = '#hex';
        input.value = remapped;

        // Remap preview swatch
        var remapSwatch = document.createElement('div');
        remapSwatch.className = 'remap-swatch' + (remapped ? ' visible' : '');
        if (remapped) remapSwatch.style.background = remapped;

        input.addEventListener('change', (function(c, inp, sw) {
          return function() { handleRemapInput(c, inp, sw); };
        })(color, input, remapSwatch));
        input.addEventListener('click', function(e) { e.stopPropagation(); });

        // Opacity input
        var opacityVal = remapOpacities[color] || '';
        var opInput = document.createElement('input');
        opInput.className = 'color-opacity-input' + (opacityVal ? ' remapped' : '');
        opInput.type = 'text';
        opInput.placeholder = origOpacity;
        opInput.title = 'Opacity 0-1 (orig: ' + origOpacity + ')';
        opInput.value = opacityVal;
        opInput.addEventListener('change', (function(c) {
          return function(e) {
            var v = e.target.value.trim();
            var before = snapshot();
            if (!v) {
              delete remapOpacities[c];
              e.target.classList.remove('remapped');
            } else {
              var num = parseFloat(v);
              if (!isNaN(num) && num >= 0 && num <= 1) {
                remapOpacities[c] = v;
                e.target.classList.add('remapped');
              } else {
                return;
              }
            }
            pushSnapshot(before);
            applyAllRemaps();
            saveState();
          };
        })(color));
        opInput.addEventListener('click', function(e) { e.stopPropagation(); });

        // Count
        var count = document.createElement('span');
        count.className = 'color-count';
        count.textContent = entries.length;

        item.appendChild(toggle);
        item.appendChild(swatch);
        item.appendChild(label);
        item.appendChild(input);
        item.appendChild(remapSwatch);
        item.appendChild(opInput);
        item.appendChild(count);

        colorList.appendChild(item);
      }
    }

    function toggleColor(color) {
      pushHistory();
      if (hiddenColors[color]) delete hiddenColors[color];
      else hiddenColors[color] = true;
      applyColorVisibility();
      renderColorList();
      saveState();
    }

    function showAllColors() {
      pushHistory();
      hiddenColors = {};
      applyColorVisibility();
      renderColorList();
      saveState();
    }

    function hideAllColors() {
      pushHistory();
      var keys = Object.keys(colorMap);
      for (var i = 0; i < keys.length; i++) hiddenColors[keys[i]] = true;
      applyColorVisibility();
      renderColorList();
      saveState();
    }

    function resetRemaps() {
      pushHistory();
      var origColors = Object.keys(colorMap);
      for (var i = 0; i < origColors.length; i++) {
        var origColor = origColors[i];
        var entries = colorMap[origColor];
        for (var j = 0; j < entries.length; j++) {
          var e = entries[j];
          if (e.prop === 'attr') {
            e.el.setAttribute(e.type, origColor);
          } else {
            var style = e.el.getAttribute('style') || '';
            var regex = new RegExp('(' + e.type + '\\s*:\\s*)([^;]+)');
            e.el.setAttribute('style', style.replace(regex, '$1' + origColor));
          }
        }
      }
      remapColors = {};
      remapOpacities = {};
      renderColorList();
      saveState();
    }

    function serializeSvg() {
      // Clone so we can drop editor-only nodes without touching the live DOM
      var clone = svgEl.cloneNode(true);
      var overlays = clone.querySelectorAll('[data-editor-overlay]');
      for (var i = 0; i < overlays.length; i++) overlays[i].remove();
      var keyed = clone.querySelectorAll('[data-svgv-key]');
      for (var i = 0; i < keyed.length; i++) keyed[i].removeAttribute('data-svgv-key');
      var hidden = clone.querySelectorAll('[visibility="hidden"]');
      for (var i = 0; i < hidden.length; i++) hidden[i].remove();
      return new XMLSerializer().serializeToString(clone);
    }

    function downloadSvg(name) {
      var blob = new Blob([serializeSvg()], { type: 'image/svg+xml' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportSvg() {
      if (!svgEl) return;
      downloadSvg(currentFileName);
    }

    function flashSaved(msg) {
      var btn = document.getElementById('btn-save');
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = old; }, 1200);
    }

    // Write straight back to the file that was dropped in, when the browser
    // gave us a writable handle for it; otherwise fall back to a download.
    function saveSvg() {
      if (!svgEl) return;
      if (!fileHandle) { saveSvgAs(); return; }
      fileHandle.requestPermission({ mode: 'readwrite' }).then(function (perm) {
        if (perm !== 'granted') { flashSaved('Denied'); return; }
        return fileHandle.createWritable().then(function (w) {
          return w.write(serializeSvg()).then(function () { return w.close(); });
        }).then(function () {
          originalSvgText = serializeSvg();
          // The file now carries these edits, and its element order has moved
          // on from what the keys were derived from, so drop the replay state
          // rather than let it reapply to the wrong elements on next load.
          pathEdits = {};
          saveState();
          flashSaved('Saved');
        });
      }).catch(function (err) {
        console.error(err);
        flashSaved('Failed');
      });
    }

    function saveSvgAs() {
      if (!svgEl) return;
      if (!window.showSaveFilePicker) { downloadSvg(currentFileName); return; }
      window.showSaveFilePicker({
        suggestedName: currentFileName,
        types: [{ description: 'SVG', accept: { 'image/svg+xml': ['.svg'] } }]
      }).then(function (handle) {
        fileHandle = handle;
        currentFileName = handle.name;
        STORAGE_KEY = 'svg-viewer-' + currentFileName;
        saveSvg();
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        console.error(err);
        downloadSvg(currentFileName);
      });
    }

    function applyColorVisibility() {
      var hideEls = {};
      var hiddenKeys = Object.keys(hiddenColors);
      for (var i = 0; i < hiddenKeys.length; i++) {
        var entries = colorMap[hiddenKeys[i]] || [];
        for (var j = 0; j < entries.length; j++) {
          hideEls[entries[j].el] = entries[j].el;
        }
      }
      // We need a proper set, use a WeakSet-like approach with a marker
      var allColors = Object.keys(colorMap);
      // First, collect all hidden elements
      var hiddenElSet = new Set();
      for (var i = 0; i < hiddenKeys.length; i++) {
        var entries = colorMap[hiddenKeys[i]] || [];
        for (var j = 0; j < entries.length; j++) hiddenElSet.add(entries[j].el);
      }
      // Then set visibility on all mapped elements
      for (var i = 0; i < allColors.length; i++) {
        var entries = colorMap[allColors[i]];
        for (var j = 0; j < entries.length; j++) {
          if (hiddenElSet.has(entries[j].el)) {
            entries[j].el.setAttribute('visibility', 'hidden');
          } else {
            entries[j].el.removeAttribute('visibility');
          }
        }
      }
    }

    // ---- Undo / redo ------------------------------------------------------
    //
    // One mechanism for everything: before any change, snapshot the SVG markup
    // plus the derived state. Undo restores a snapshot wholesale, so every
    // edit -- colors, opacity, remaps, hidden colors, outset, deletions, point
    // moves -- is undoable by construction and nothing can drift out of sync.

    var HISTORY_LIMIT = 200;

    function snapshotMarkup() {
      var clone = svgEl.cloneNode(true);
      var overlays = clone.querySelectorAll('[data-editor-overlay]');
      for (var i = 0; i < overlays.length; i++) overlays[i].remove();
      return clone.outerHTML;
    }

    function snapshot() {
      if (!svgEl) return null;
      return {
        svg: snapshotMarkup(),
        state: JSON.stringify({
          remapColors: remapColors,
          remapOpacities: remapOpacities,
          hiddenColors: hiddenColors,
          pathEdits: pathEdits
        }),
        selectedKey: selectedEl ? getElKey(selectedEl) : null,
        selectedAnchor: selectedAnchor
      };
    }

    function pushSnapshot(snap) {
      if (!snap) return;
      undoStack.push(snap);
      if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
      redoStack = [];
      updateHistoryButtons();
    }

    // Call before mutating anything
    function pushHistory() {
      pushSnapshot(snapshot());
    }

    function restoreSnapshot(snap) {
      deselectPath();
      canvas.innerHTML = snap.svg;
      svgEl = canvas.querySelector('svg');
      if (!svgEl) return;

      var st = JSON.parse(snap.state);
      remapColors = st.remapColors || {};
      remapOpacities = st.remapOpacities || {};
      hiddenColors = st.hiddenColors || {};
      pathEdits = st.pathEdits || {};

      buildElKeys(svgEl);
      buildColorMap(svgEl);
      renderColorList();
      saveState();

      // The markup already carries every edit, so nothing is re-applied here
      if (snap.selectedKey && elKeyMap[snap.selectedKey]) {
        selectPath(elKeyMap[snap.selectedKey]);
        if (snap.selectedAnchor >= 0 && pathSegs && snap.selectedAnchor < pathSegs.length) {
          selectedAnchor = snap.selectedAnchor;
          drawHandles(selectedEl);
        }
      }
    }

    function undoPathEdit() {
      if (!undoStack.length) return;
      var current = snapshot();
      restoreSnapshot(undoStack.pop());
      if (current) redoStack.push(current);
      updateHistoryButtons();
    }

    function redoPathEdit() {
      if (!redoStack.length) return;
      var current = snapshot();
      restoreSnapshot(redoStack.pop());
      if (current) undoStack.push(current);
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      var u = document.getElementById('btn-undo');
      var r = document.getElementById('btn-redo');
      if (u) u.disabled = !undoStack.length;
      if (r) r.disabled = !redoStack.length;
    }

    function resetAll() {
      if (!confirm('Reset ALL changes? This will clear all color remaps, opacity changes, path edits, and hidden colors.')) return;
      localStorage.removeItem(STORAGE_KEY);
      // Reload the file exactly as it was dropped, so deletions and outsets
      // don't get baked in by re-serializing the edited DOM
      if (originalSvgText) {
        loadSvgText(originalSvgText, currentFileName);
      } else if (svgEl) {
        loadSvgText(new XMLSerializer().serializeToString(svgEl), currentFileName);
      }
    }

    // Path selection
    var selectedEl = null;
    var pathEditor = document.getElementById('path-editor');
    var peTag = document.getElementById('pe-tag');
    var peRows = document.getElementById('pe-rows');

    function selectPath(el) {
      deselectPath();
      selectedEl = el;

      // Point handles are the selection indicator, so paths get no outline
      pathEditor.classList.add('open');

      peTag.textContent = '<' + el.tagName + '>' + (el.id ? ' #' + el.id : '');
      peRows.innerHTML = '';

      // Show fill if present
      var colors = extractColors(el, true);
      if (colors.length === 0) {
        var note = document.createElement('div');
        note.className = 'pe-note';
        note.textContent = 'No fill or stroke on this element';
        peRows.appendChild(note);
      }

      for (var i = 0; i < colors.length; i++) {
        var c = colors[i];
        var row = document.createElement('div');
        row.className = 'pe-row';

        var lbl = document.createElement('span');
        lbl.className = 'pe-label' + (c.inherited ? ' pe-inherited' : '');
        lbl.textContent = c.type;
        if (c.inherited) lbl.title = 'inherited from a parent group or a CSS rule';

        var sw = document.createElement('div');
        sw.className = 'pe-swatch';
        sw.style.background = c.color;

        var inp = document.createElement('input');
        inp.className = 'pe-input';
        inp.type = 'text';
        inp.value = c.color;

        var opLbl = document.createElement('span');
        opLbl.className = 'pe-label';
        opLbl.textContent = 'a';
        opLbl.style.width = '12px';

        var origOp = c.origOpacity || '1';
        var opInp = document.createElement('input');
        opInp.className = 'pe-opacity-input';
        opInp.type = 'text';
        opInp.value = origOp;

        inp.addEventListener('change', (function(element, type, prop, swatch) {
          return function(e) {
            var val = e.target.value.trim().toLowerCase();
            if (val && val[0] !== '#') val = '#' + val;
            if (/^#[0-9a-f]{6}$/.test(val) || /^#[0-9a-f]{3}$/.test(val)) {
              pushHistory();
              if (prop === 'attr') {
                element.setAttribute(type, val);
              } else {
                setStyleProp(element, type, val);
              }
              swatch.style.background = val;
              recordPathEdit(element, type, val);
              // An active outset is painted in the fill color, so follow it
              if (type === 'fill' && getOutset(element) > 0) applyOutset(element, getOutset(element));
            }
          };
        })(el, c.type, c.prop, sw));

        opInp.addEventListener('change', (function(element, type, prop) {
          return function(e) {
            var v = parseFloat(e.target.value.trim());
            if (!isNaN(v) && v >= 0 && v <= 1) {
              pushHistory();
              setOpacity(element, type, v);
              recordPathEdit(element, type + '-opacity', '' + v);
            }
          };
        })(el, c.type, c.prop));

        row.appendChild(lbl);
        row.appendChild(sw);
        row.appendChild(inp);
        row.appendChild(opLbl);
        row.appendChild(opInp);
        peRows.appendChild(row);
      }

      buildOutsetRow(el);
      buildPointsRow(el);
      setPointsMode(isEditablePath(el)); // points are editable straight away
    }

    function buildPointsRow(el) {
      var sep = document.createElement('div');
      sep.className = 'pe-sep';
      peRows.appendChild(sep);

      var row = document.createElement('div');
      row.className = 'pe-row';

      var lbl = document.createElement('span');
      lbl.className = 'pe-label';
      lbl.textContent = 'points';
      row.appendChild(lbl);

      var note = document.createElement('span');
      note.className = 'pe-note';
      note.id = 'pe-points-note';
      note.textContent = isEditablePath(el)
        ? 'drag to move, double-click the path to add, Delete to remove'
        : 'only <path> elements have editable points';
      row.appendChild(note);
      peRows.appendChild(row);
    }

    // Grow the shape outward to close a gap against its neighbours
    function buildOutsetRow(el) {
      var sep = document.createElement('div');
      sep.className = 'pe-sep';
      peRows.appendChild(sep);

      var row = document.createElement('div');
      row.className = 'pe-row';

      var lbl = document.createElement('span');
      lbl.className = 'pe-label';
      lbl.textContent = 'outset';
      lbl.title = 'grow the shape outward, in SVG user units, to close gaps';

      var cur = getOutset(el);
      var before = cur;

      var slider = document.createElement('input');
      slider.className = 'pe-slider';
      slider.type = 'range';
      slider.min = '0';
      slider.max = '' + maxOutset();
      slider.step = '0.5';
      slider.value = '' + cur;

      var num = document.createElement('input');
      num.className = 'pe-opacity-input';
      num.type = 'text';
      num.value = '' + cur;

      function commit(val) {
        if (val === before) return;
        // the slider previews live, so the pre-drag snapshot is the one to keep
        pushSnapshot(dragSnapshot || snapshot());
        dragSnapshot = null;
        setOutset(el, val);
        before = val;
      }

      var dragSnapshot = null;
      slider.addEventListener('mousedown', function () {
        dragSnapshot = snapshot(); // taken before the live preview starts
      });
      slider.addEventListener('input', function () {
        num.value = slider.value;
        applyOutset(el, parseFloat(slider.value)); // live preview, not recorded
      });
      slider.addEventListener('change', function () {
        commit(parseFloat(slider.value) || 0);
      });
      slider.addEventListener('click', function (e) { e.stopPropagation(); });

      num.addEventListener('change', function () {
        var v = parseFloat(num.value.trim());
        if (isNaN(v) || v < 0) { num.value = '' + before; return; }
        slider.value = '' + Math.min(v, parseFloat(slider.max));
        commit(v);
      });
      num.addEventListener('click', function (e) { e.stopPropagation(); });

      row.appendChild(lbl);
      row.appendChild(slider);
      row.appendChild(num);
      peRows.appendChild(row);
    }

    function deleteSelected() {
      if (!selectedEl) return;
      var el = selectedEl;
      deselectPath(); // drops the outline clone so nextSibling is the real one
      var parent = el.parentNode;
      if (!parent) return;
      var key = getElKey(el);

      function remove() {
        if (el.parentNode) el.parentNode.removeChild(el);
        if (key) {
          if (!pathEdits[key]) pathEdits[key] = {};
          pathEdits[key].deleted = true;
        }
        saveState();
      }
      pushHistory();
      remove();
    }

    // ---- Path geometry editing -------------------------------------------

    var ARG_COUNT = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7, Z: 0 };

    function parsePathData(d) {
      var i = 0, len = d.length, segs = [];
      function skipSep() { while (i < len && (d[i] === ' ' || d[i] === ',' || d[i] === '\n' || d[i] === '\r' || d[i] === '\t')) i++; }
      function readNumber() {
        skipSep();
        var start = i;
        if (d[i] === '+' || d[i] === '-') i++;
        while (i < len && d[i] >= '0' && d[i] <= '9') i++;
        if (d[i] === '.') { i++; while (i < len && d[i] >= '0' && d[i] <= '9') i++; }
        if (d[i] === 'e' || d[i] === 'E') {
          i++;
          if (d[i] === '+' || d[i] === '-') i++;
          while (i < len && d[i] >= '0' && d[i] <= '9') i++;
        }
        if (start === i) return NaN;
        return parseFloat(d.slice(start, i));
      }
      // Arc flags may be written without separators ("a5 5 0 0110 10"), so they
      // have to be read one character at a time.
      function readFlag() {
        skipSep();
        if (d[i] === '0' || d[i] === '1') { var v = d[i] === '1' ? 1 : 0; i++; return v; }
        return NaN;
      }

      var cmd = null;
      while (i < len) {
        skipSep();
        if (i >= len) break;
        var ch = d[i];
        if (/[MmLlHhVvCcSsQqTtAaZz]/.test(ch)) {
          cmd = ch;
          i++;
        } else if (cmd === null) {
          throw new Error('Bad path data: expected a command at index ' + i + ' of "' + d + '"');
        } else if (cmd === 'M') {
          cmd = 'L'; // implicit lineto after a moveto
        } else if (cmd === 'm') {
          cmd = 'l';
        }
        var up = cmd.toUpperCase();
        var n = ARG_COUNT[up];
        if (n === 0) { segs.push([cmd]); skipSep(); continue; }
        var args = [];
        for (var k = 0; k < n; k++) {
          var v = (up === 'A' && (k === 3 || k === 4)) ? readFlag() : readNumber();
          if (isNaN(v)) throw new Error('Bad path data near index ' + i + ' of "' + d + '"');
          args.push(v);
        }
        segs.push([cmd].concat(args));
        skipSep();
      }
      return segs;
    }

    // Rewrite any path into absolute M/L/C/Q/A/Z, which is the same shape but
    // lets every point be moved independently.
    function normalizePathData(d) {
      var segs = parsePathData(d);
      var out = [];
      var cx = 0, cy = 0, sx = 0, sy = 0;
      var lastCubicCtrl = null, lastQuadCtrl = null;

      for (var i = 0; i < segs.length; i++) {
        var s = segs[i];
        var c = s[0];
        var up = c.toUpperCase();
        var rel = c !== up;
        var ox = rel ? cx : 0, oy = rel ? cy : 0;
        var x, y, x1, y1, x2, y2;

        if (up === 'M') {
          x = s[1] + ox; y = s[2] + oy;
          out.push(['M', x, y]);
          cx = sx = x; cy = sy = y;
          lastCubicCtrl = lastQuadCtrl = null;
        } else if (up === 'L') {
          x = s[1] + ox; y = s[2] + oy;
          out.push(['L', x, y]);
          cx = x; cy = y;
          lastCubicCtrl = lastQuadCtrl = null;
        } else if (up === 'H') {
          x = s[1] + ox;
          out.push(['L', x, cy]);
          cx = x;
          lastCubicCtrl = lastQuadCtrl = null;
        } else if (up === 'V') {
          y = s[1] + oy;
          out.push(['L', cx, y]);
          cy = y;
          lastCubicCtrl = lastQuadCtrl = null;
        } else if (up === 'C') {
          x1 = s[1] + ox; y1 = s[2] + oy;
          x2 = s[3] + ox; y2 = s[4] + oy;
          x = s[5] + ox; y = s[6] + oy;
          out.push(['C', x1, y1, x2, y2, x, y]);
          cx = x; cy = y;
          lastCubicCtrl = [x2, y2]; lastQuadCtrl = null;
        } else if (up === 'S') {
          x2 = s[1] + ox; y2 = s[2] + oy;
          x = s[3] + ox; y = s[4] + oy;
          x1 = lastCubicCtrl ? 2 * cx - lastCubicCtrl[0] : cx;
          y1 = lastCubicCtrl ? 2 * cy - lastCubicCtrl[1] : cy;
          out.push(['C', x1, y1, x2, y2, x, y]);
          cx = x; cy = y;
          lastCubicCtrl = [x2, y2]; lastQuadCtrl = null;
        } else if (up === 'Q') {

      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      viewport.style.outline = '3px dashed #4a9eff';
    });
    document.addEventListener('dragleave', function(e) {
      if (e.relatedTarget === null || !document.contains(e.relatedTarget)) {
        viewport.style.outline = '';
      }
    });
    document.addEventListener('drop', function(e) {
      e.preventDefault();
      viewport.style.outline = '';
      var file = e.dataTransfer.files[0];
      if (!file || !file.name.toLowerCase().endsWith('.svg')) return;

      // Grab a writable handle for the dropped file if the browser offers one,
      // so Save can overwrite it in place rather than downloading a copy.
      var item = e.dataTransfer.items && e.dataTransfer.items[0];
      var handlePromise = (item && item.getAsFileSystemHandle)
        ? item.getAsFileSystemHandle().catch(function () { return null; })
        : Promise.resolve(null);

      handlePromise.then(function (handle) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          fileHandle = (handle && handle.kind === 'file') ? handle : null;
          loadSvgText(ev.target.result, file.name);
        };
        reader.readAsText(file);
      });
    });

    // No default SVG - wait for drag and drop
  </script>
</body>
</html>
